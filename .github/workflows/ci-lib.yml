---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ github.repository }} with Idris2 latest
    runs-on: ubuntu-latest
    env:
      PACK_DIR: /root/.pack
    strategy:
      fail-fast: false
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --yes typst
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build tpl
        run: pack install tpl
      - name: Test tpl
        run: pack test tpl -n 1000
      - name: Make docs
        run: ./makedocs.sh
